<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library | WordSprint</title>

    <style>

        /* ==============================
           基本
        ============================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #222;
        }


        /* ==============================
           ヘッダー
        ============================== */

        .top-header {
            background: white;
            padding: 16px 24px;
            border-bottom: 1px solid #ddd;
        }

        .top-header a {
            text-decoration: none;
            color: #222;
            font-size: 22px;
            font-weight: bold;
        }


        /* ==============================
           Library全体
        ============================== */

        .library-container {
            width: min(900px, 92%);
            margin: 40px auto;
        }

        .library-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 35px;
        }


        /* ==============================
           Libraryカード
        ============================== */

        #library {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .library-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }


        /* ==============================
           単語
        ============================== */

        .library-word {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .library-meaning {
            color: #666;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .library-info {
            font-size: 13px;
            color: #888;
        }


        /* ==============================
           読み込み中
        ============================== */

        .loading {
            text-align: center;
            color: #777;
            padding: 50px 20px;
        }


        /* ==============================
           スマホ
        ============================== */

        @media (max-width: 700px) {

            .library-container {
                margin-top: 25px;
            }

            .library-title {
                font-size: 27px;
            }

            #library {
                grid-template-columns: 1fr;
            }

        }
        /* ==============================
   フィルター
============================== */

.library-filters {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
}


/* 検索 */

#searchInput {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
}


/* セレクト */

#unitFilter,
#statusFilter {
    padding: 11px 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    background: white;
    margin-right: 8px;
    cursor: pointer;
}


/* リセット */

#resetFilters {
    padding: 11px 16px;
    border: none;
    border-radius: 10px;
    background: #eee;
    color: #333;
    font-size: 15px;
    cursor: pointer;
}


#resetFilters:hover {
    background: #ddd;
}


/* 件数 */

.result-count {
    margin: 15px 0 0;
    color: #777;
    font-size: 14px;
}

    </style>

</head>


<body>

    <!-- ヘッダー -->

    <header class="top-header">
        <a href="index.html">🏃 WordSprint</a>
    </header>


    <!-- Library -->

    <main class="library-container">

      <h1 class="library-title">
    📚 Library
</h1>


<!-- ==============================
     フィルター
============================== -->

<section class="library-filters">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 単語を検索..."
    >


    <select id="unitFilter">

        <option value="all">
            📚 すべてのUnit
        </option>

    </select>


    <select id="statusFilter">

        <option value="all">
            🎯 すべての評価
        </option>

        <option value="perfect">
            😎 完璧
        </option>

        <option value="unsure">
            🤔 あやしい
        </option>

        <option value="bad">
            😵 全然
        </option>

        <option value="unrated">
            ⚪ 未評価
        </option>

    </select>


    <button id="resetFilters">
        🔄 リセット
    </button>


    <p class="result-count">
        <span id="resultCount">0</span>語を表示
    </p>

</section>


<div id="library">

    </main>


    <script src="js/library.js"></script>

</body>

</html>
