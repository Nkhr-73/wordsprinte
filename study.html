<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study | WordSprint</title>

    <style>
        /* ==============================
           基本
        ============================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #222;
        }


        /* ==============================
           ヘッダー
        ============================== */

        .top-header {
            background: white;
            padding: 16px 24px;
            border-bottom: 1px solid #ddd;
        }

        .top-header a {
            text-decoration: none;
            color: #222;
            font-size: 22px;
            font-weight: bold;
        }


        /* ==============================
           Study全体
        ============================== */

        .study-container {
            width: min(700px, 92%);
            margin: 40px auto;
            text-align: center;
        }

        .study-title {
            font-size: 32px;
            margin-bottom: 30px;
        }


        /* ==============================
           進捗
        ============================== */

        .progress-number {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e1e4e8;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 45px;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: #333;
            border-radius: 10px;
        }


        /* ==============================
           単語カード
        ============================== */

        .word-card {
            background: white;
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        #word {
            font-size: 42px;
            margin: 0 0 30px;
        }

        #meaning {
            font-size: 22px;
            color: #555;
            margin-top: 25px;
        }


        /* ==============================
           意味を見る
        ============================== */

        #showMeaning {
            border: none;
            background: #222;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #showMeaning:hover {
            opacity: 0.8;
        }


        /* ==============================
           評価ボタン
        ============================== */

        .rating-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .rating-buttons button {
            border: none;
            border-radius: 12px;
            padding: 16px 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .rating-buttons button:hover {
            transform: translateY(-2px);
        }


        /* ==============================
           前後ボタン
        ============================== */

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .navigation-buttons button {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 16px;
        }

        .navigation-buttons button:hover {
            background: #f0f0f0;
        }


        /* ==============================
           スマホ
        ============================== */

        @media (max-width: 600px) {

            .study-container {
                margin-top: 25px;
            }

            .study-title {
                font-size: 27px;
            }

            #word {
                font-size: 34px;
            }

            .word-card {
                padding: 40px 20px;
            }

            .rating-buttons {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

    <!-- ヘッダー -->

    <header class="top-header">
        <a href="index.html">🏃 WordSprint</a>
    </header>


    <!-- Study -->

    <main class="study-container">

        <h1 class="study-title">📖 Study</h1>


        <!-- 進捗 -->

        <div class="progress-number">
            <span id="current">1</span> /
            <span id="total">3</span>
        </div>

        <div class="progress-bar">
            <div id="progress"></div>
        </div>


        <!-- 単語カード -->

        <section class="word-card">

            <h2 id="word">単語</h2>

            <button id="showMeaning">
                意味を見る
            </button>

            <p id="meaning">意味</p>

        </section>


        <!-- 評価 -->

        <div class="rating-buttons">

            <button onclick="rate('bad')">
                😵 全然
            </button>

            <button onclick="rate('unsure')">
                🤔 あやしい
            </button>

            <button onclick="rate('perfect')">
                😎 完璧
            </button>

        </div>


        <!-- 前後 -->

        <div class="navigation-buttons">

            <button onclick="previousWord()">
                ← 前へ
            </button>

            <button onclick="nextWord()">
                次へ →
            </button>

        </div>

    </main>


    <script src="js/study.js"></script>

</body>

</html>
