<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study | WordSprint</title>
</head>

<body>

    <h1>📖 Study</h1>

    <p>
        <span id="current">1</span> /
        <span id="total">3</span>
    </p>

    <h2 id="word">単語</h2>

    <button id="showMeaning">
        意味を見る
    </button>

    <p id="meaning">意味</p>

    <div>
        <button onclick="rate('bad')">😵 全然</button>
        <button onclick="rate('unsure')">🤔 あやしい</button>
        <button onclick="rate('perfect')">😎 完璧</button>
    </div>

    <button onclick="previousWord()">← 前へ</button>
    <button onclick="nextWord()">次へ →</button>

    <script src="js/study.js"></script>

</body>

</html>
